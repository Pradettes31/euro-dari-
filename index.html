    <title>EURO DARI</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#eef2f1; --sf:#fff; --ink:#16232a; --mut:#5d6f75; --ac:#1b6b5a; --acf:#fff; --wm:#f2b134; --ln:#d6dfdd; --tile:#e3ebe9; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; padding-bottom: 80px; }
        
        /* Header */
        header { background: var(--sf); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--ln); }
        header h1 { margin: 0; font-size: 22px; color: var(--ac); font-weight: 700; }
        .cart-btn { background: var(--ac); color: var(--acf); border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .cart-count { background: var(--wm); color: var(--ink); border-radius: 50%; padding: 2px 8px; font-size: 14px; }
