<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101a1d;--sf:#18262a;--ink:#e8f0ee;--mut:#9bb0b0;--ac:#3fb59a;--acf:#06201a;--ln:#2a3c40;--tile:#203237}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101a1d;--sf:#18262a;--ink:#e8f0ee;--mut:#9bb0b0;--ac:#3fb59a;--acf:#06201a;--ln:#2a3c40;--tile:#203237}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,Arial,sans-serif;line-height:1.5;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:1.25rem;margin:0}
.cartbtn{border:0;background:var(--ac);color:var(--acf);font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.cartbtn b{background:var(--wm);color:#16232a;border-radius:999px;padding:0 8px;margin-inline-start:6px}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.contact a{flex:1 1 220px;display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;font-size:.85rem;font-weight:600}
.search{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
main{padding:14px;max-width:1000px;margin:auto}
.hint{color:var(--mut);font-size:.85rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:120px;display:grid;place-items:center;font-size:3rem;background:var(--tile);position:relative}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--wm);color:#16232a;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px}
.bd{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:600;font-size:.95rem;margin:0}
.ds{color:var(--mut);font-size:.8rem;margin:0}
.pr{margin-top:auto;display:flex;align-items:baseline;gap:6px;font-weight:700}
.add{border:0;background:var(--ac);color:var(--acf);font:inherit;font-weight:600;padding:8px;border-radius:9px;cursor:pointer;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
#ov.on{display:block}
#sheet{position:fixed;bottom:0;inset-inline:0;max-height:85%;background:var(--sf);border-radius:18px 18px 0 0;z-index:21;display:none;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:600px;margin:auto}
#sheet.on{display:flex}
.items{overflow:auto;flex:1}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.it .e{font-size:1.6rem}
.it .t{flex:1;font-size:.9rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;margin:12px 0 8px}
.act{display:flex;gap:8px}
.act a,.act button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;padding:10px;border-radius:10px;cursor:pointer}
.act a{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.ghost{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer}
/* شريط السلة العائم في الأسفل */
#floatbar{position:fixed;bottom:0;inset-inline:0;z-index:15;background:var(--ac);color:var(--acf);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,.15);max-width:1000px;margin:auto}
#floatbar.on{display:flex}
#floatbar .fb-info{display:flex;flex-direction:column;font-size:.85rem}
#floatbar .fb-info b{font-size:1rem}
#floatbar button{border:0;background:var(--wm);color:#16232a;font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--wm);outline-offset:2px}
</style>

let cat = ALL, query = '', sortMode = 'rel';

const $ = s => document.querySelector(s);
const grid = $('#grid'), chips = $('#chips'), hint = $('#hint');
const sheet = $('#sheet'), ov = $('#ov'), floatbar = $('#floatbar');

// ===== CHIPS =====
function renderChips(){
  chips.innerHTML = '';
  [ALL,...CATS].forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c;
    b.setAttribute('aria-pressed', c===cat);
    b.onclick = ()=>{ cat = c; renderChips(); render(); };
    chips.appendChild(b);
  });
}

// ===== RENDER PRODUCTS =====
function render(){
  const term = query.trim().toLowerCase();
  let list = PRODUCTS.filter(p => {
    if(cat!==ALL && p.c!==cat) return false;
    if(term && !(p.n.toLowerCase().includes(term) || p.c.toLowerCase().includes(term))) return false;
    return true;
  });
  if(sortMode==='az') list.sort((a,b)=>a.n.localeCompare(b.n,'fr'));
  hint.textContent = list.length + ' produit' + (list.length>1?'s':'') + (cat!==ALL?' · '+cat:'');
  if(!list.length){
    grid.innerHTML = '<div class="empty">Aucun produit trouvé 😕</div>';
    return;
  }
  grid.innerHTML = list.map(p=>{
    const qty = cart[p.id]||0;
    return `<div class="card">
      <div class="pic">${p.e}</div>
      <div class="bd">
        <h3 class="nm">${p.n}</h3>
        <p class="ds">${p.d}</p>
        ${p.p!=null?`<div class="pr">${fmt(p.p)}</div>`:'<div class="pr" style="color:var(--mut);font-size:.85rem">Prix en magasin</div>'}
        <button class="add" data-id="${p.id}">${qty>0?'✓ Ajouté ('+qty+')':'+ Ajouter'}</button>
      </div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.add').forEach(b=>{
    b.onclick = ()=>{ addToCart(+b.dataset.id); };
  });
}

// ===== CART =====
function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  saveCart(); updateUI();
  if(!sheet.classList.contains('on')) render();
}
function saveCart(){ localStorage.setItem('cart', JSON.stringify(cart)); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,q])=>{
    const p = PRODUCTS.find(x=>x.id==id);
    return sum + (p&&p.p!=null ? p.p*q : 0);
  },0);
}

// ===== UPDATE UI (bar + count) =====
function updateUI(){
  const count = cartCount(), total = cartTotal();
  $('#cnt').textContent = count;
  if(count>0){
    floatbar.classList.add('on');
    $('#fbcount').textContent = count + ' article' + (count>1?'s':'');
    $('#fbtotal').textContent = total>0 ? fmt(total) : 'Prix en magasin';
  } else {
    floatbar.classList.remove('on');
  }
}

// ===== CART SHEET =====
function openSheet(){
  if(cartCount()===0){
    sheet.innerHTML = `<div class="empty">Votre panier est vide 🛒<br><button class="cartbtn" style="margin-top:12px" onclick="closeSheet()">Continuer les achats</button></div>`;
    sheet.classList.add('on'); ov.classList.add('on');
    return;
  }
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="margin:0;font-size:1.1rem">Votre panier</h2><button class="ghost" onclick="closeSheet()">✕</button></div><div class="items">';
  let hasPrice = false;
  Object.entries(cart).forEach(([id,q])=>{
    const p = PRODUCTS.find(x=>x.id==id);
    if(!p) return;
    if(p.p!=null) hasPrice = true;
    html += `<div class="it">
      <span class="e">${p.e}</span>
      <div class="t"><b>${p.n}</b><br><small style="color:var(--mut)">${p.p!=null?fmt(p.p):'Prix en magasin'}</small></div>
      <div class="qty">
        <button onclick="changeQty(${p.id},-1)">−</button>
        <span>${q}</span>
        <button onclick="changeQty(${p.id},1)">+</button>
      </div>
    </div>`;
  });
  html += '</div>';
  const total = cartTotal();
  html += `<div class="tot"><span>Total</span><span>${hasPrice?fmt(total):'—'}</span></div>`;
  html += `<div class="act"><button onclick="clearCart()">Vider</button><a id="waBtn" href="#" target="_blank">Commander sur WhatsApp</a></div>`;
  sheet.innerHTML = html;
  sheet.classList.add('on'); ov.classList.add('on');
  buildWhatsApp();
}
function buildWhatsApp(){
  let msg = 'Bonjour ' + STORE.name + ',\nje souhaite commander :\n\n';
  Object.entries(cart).forEach(([id,q])=>{
    const p = PRODUCTS.find(x=>x.id==id);
    if(p) msg += `• ${q} × ${p.n}${p.p!=null?' — '+fmt(p.p*q):''}\n`;
  });
  const total = cartTotal();
  if(total>0) msg += `\nTotal estimé : ${fmt(total)}`;
  msg += '\n\nMerci !';
  document.getElementById('waBtn').href = 'https://wa.me/'+STORE.phone+'?text='+encodeURIComponent(msg);
}
function closeSheet(){ sheet.classList.remove('on'); ov.classList.remove('on'); render(); }
function changeQty(id,d){
  cart[id] = (cart[id]||0) + d;
  if(cart[id]<=0) delete cart[id];
  saveCart(); updateUI();
  if(sheet.classList.contains('on')) openSheet();
  else render();
}
function clearCart(){ if(confirm('Vider le panier ?')){ cart={}; saveCart(); updateUI(); closeSheet(); } }

// ===== EVENTS =====
$('#q').addEventListener('input', e=>{ query=e.target.value; render(); });
$('#sort').addEventListener('change', e=>{ sortMode=e.target.value; render(); });
$('#openCart').onclick = openSheet;
$('#fbopen').onclick = openSheet;
ov.onclick = closeSheet;

// ===== INIT =====
renderChips();
render();
updateUI();
</script>
</body>
</html>
